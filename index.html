<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cloud Metrics Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; }
    h1 { text-align: center; }
    .grid { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin-top: 30px; }
    .card { background: #1e293b; padding: 20px; border-radius: 10px; width: 220px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .card h3 { margin: 0 0 10px; color: #38bdf8; }
    .value { font-size: 28px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Cloud Infrastructure Overview (Placeholder)</h1>
  <div class="grid">
    <div class="card"><h3>Avg CPU Usage</h3><div class="value">47.8%</div></div>
    <div class="card"><h3>Avg Memory</h3><div class="value">62.2%</div></div>
    <div class="card"><h3>Total Requests</h3><div class="value">22,175</div></div>
    <div class="card"><h3>Active Nodes</h3><div class="value">10 / 10</div></div>
  </div>
</body>
</html>
